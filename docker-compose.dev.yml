version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: gescoop_app_dev
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - DB_HOST=db
      - DB_USER=gescoop_user
      - DB_PASSWORD=gescoop_password
      - DB_NAME=gescoop_db
      - DB_PORT=3306
      - JWT_SECRET=your_jwt_secret_key
      - PORT=5000
    volumes:
      # Montar el código fuente completo para desarrollo
      - ./:/usr/src/app
      # Excluir node_modules para usar los del contenedor
      - /usr/src/app/node_modules
    depends_on:
      - db
    networks:
      - gescoop_network

  # Utilizando la misma base de datos que ya existe
  db:
    image: mysql:8.0
    container_name: gescoop_db
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: gescoop_db
      MYSQL_USER: gescoop_user
      MYSQL_PASSWORD: gescoop_password
    volumes:
      # Usando el mismo volumen que la base de datos existente
      - gescoop_db_data:/var/lib/mysql
      # Los archivos de inicialización solo se ejecutan si el volumen está vacío
      # como ya tienes datos, estos no se ejecutarán
      - ./database/mysql-config.cnf:/etc/mysql/conf.d/mysql-config.cnf
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - gescoop_network

volumes:
  # Referenciando el volumen existente en lugar de crear uno nuevo
  gescoop_db_data:
    external: true
    name: modeloweb_gescoop_db_data

networks:
  gescoop_network:
    driver: bridge