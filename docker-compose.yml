version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.multistage
    container_name: gescoop_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_USER=gescoop_user
      - DB_PASSWORD=gescoop_password
      - DB_NAME=gescoop_db
      - DB_PORT=3306
      - JWT_SECRET=your_jwt_secret_key
      - PORT=5000
    volumes:
      # Montar el código fuente completo para desarrollo
      - ./:/usr/src/app
      # Excluir los node_modules del host para usar los del contenedor
      - /usr/src/app/node_modules
      # Configurar el directorio de logs para persistencia
      - ./logs:/usr/src/app/logs
    depends_on:
      - db
    networks:
      - gescoop_network

  db:
    image: mysql:8.0
    container_name: gescoop_db
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: gescoop_db
      MYSQL_USER: gescoop_user
      MYSQL_PASSWORD: gescoop_password
    volumes:
      - gescoop_db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/01-init-roles.sql:/docker-entrypoint-initdb.d/02-roles.sql
      - ./database/02-init-users.sql:/docker-entrypoint-initdb.d/03-users.sql
      - ./database/mysql-config.cnf:/etc/mysql/conf.d/mysql-config.cnf
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - gescoop_network

volumes:
  gescoop_db_data:

networks:
  gescoop_network:
    driver: bridge