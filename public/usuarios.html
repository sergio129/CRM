<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - GESCOOP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="wrapper">
        <!-- El sidebar compartido se cargará aquí -->
        <div id="sidebar-container"></div>

        <!-- Page Content -->
        <div id="content">
            <nav class="navbar navbar-expand-lg navbar-light">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn btn-info">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h2 class="ml-3 mb-0">Gestión de Usuarios</h2>
                </div>
            </nav>

            <div class="content-body">
                <div class="container mt-4">
                    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
                        <!-- Botón de agregar para versión móvil -->
                        <button class="btn btn-primary btn-animate mb-3 mb-md-0 d-md-none" id="mobileCreateUserButton">
                            <i class="fas fa-plus"></i> Nuevo Usuario
                        </button>
                        
                        <!-- Agregar barra de búsqueda -->
                        <div class="search-container">
                            <div class="input-group">
                                <input type="text" id="tableSearch" class="form-control search-input" placeholder="Buscar por nombre, email o usuario...">
                                <button class="btn search-btn" type="button" onclick="filterTable()">
                                    <i class="fas fa-search"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Tabla de Usuarios -->
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre Completo</th>
                                    <th>Email</th>
                                    <th>Usuario</th>
                                    <th>Rol</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="userTableBody">
                                <tr>
                                    <td>1</td>
                                    <td>Juan Pérez</td>
                                    <td>juan.perez@example.com</td>
                                    <td>juanp</td>
                                    <td>Administrador</td>
                                    <td><span class="estado-badge estado-activo">Activo</span></td>
                                    <td>
                                        <div class="action-buttons">
                                            <button class="btn btn-info btn-sm action-btn" onclick="viewUserDetails('1')" title="Ver detalles">
                                                <i class="fas fa-eye"></i>
                                            </button>
                                            <button class="btn btn-warning btn-sm action-btn" onclick="editUser('1')" title="Editar usuario">
                                                <i class="fas fa-edit"></i>
                                            </button>
                                            <button class="btn btn-danger btn-sm action-btn" onclick="deleteUser('1')" title="Eliminar usuario">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para crear/editar usuario -->
    <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="userModalLabel">Crear/Editar Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="userForm">
                        <input type="hidden" id="userId">
                        
                        <!-- Campo de búsqueda de empleado (solo visible en modo edición) -->
                        <div class="mb-4 search-employee-section" id="searchEmployeeSection" style="display: none;">
                            <label for="searchEmployee" class="form-label">Buscar Empleado</label>
                            <div class="input-group">
                                <input type="text" class="form-control search-input" id="searchEmployee" placeholder="Número de documento">
                                <button class="btn btn-search" type="button" onclick="searchEmployeeByDocument()">
                                    <i class="fas fa-search"></i> Buscar
                                </button>
                            </div>
                            <small class="text-muted">Ingrese el número de documento del empleado</small>
                        </div>

                        <div class="mb-4">
                            <label for="fullName" class="form-label">Nombre Completo</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0">
                                    <i class="fas fa-user text-muted"></i>
                                </span>
                                <input type="text" class="form-control border-start-0" id="fullName" required readonly>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="email" class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0">
                                    <i class="fas fa-envelope text-muted"></i>
                                </span>
                                <input type="email" class="form-control border-start-0" id="email" required readonly>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="username" class="form-label">Usuario Sugerido</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0">
                                    <i class="fas fa-user-circle text-muted"></i>
                                </span>
                                <input type="text" class="form-control border-start-0" id="username" required>
                            </div>
                            <small class="text-muted">Usuario generado automáticamente - puede modificarlo</small>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0">
                                    <i class="fas fa-lock text-muted"></i>
                                </span>
                                <input type="password" class="form-control border-start-0" id="password" required>
                                <button class="btn btn-outline-secondary border-start-0" type="button" id="togglePassword">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label for="role" class="form-label">Rol</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-transparent border-end-0">
                                        <i class="fas fa-user-tag text-muted"></i>
                                    </span>
                                    <select class="form-select border-start-0" id="role" required>
                                        <!-- Los roles se cargarán dinámicamente desde el servidor -->
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label for="status" class="form-label">Estado</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-transparent border-end-0">
                                        <i class="fas fa-toggle-on text-muted"></i>
                                    </span>
                                    <select class="form-select border-start-0" id="status" required>
                                        <option value="Activo">Activo</option>
                                        <option value="Inactivo">Inactivo</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                    <button type="button" class="btn save-button" onclick="saveUser()">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container para notificaciones -->
    <div id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <!-- Agregar el script del sidebar compartido -->
    <script src="js/sidebar-handler.js"></script>
    <script src="js/usuarios.js"></script>
    <script>
        function logout() {
            localStorage.clear(); // Limpia el almacenamiento local
            window.location.href = '/login.html'; // Redirige al login
        }

        // Mostrar/ocultar contraseña
        document.addEventListener('DOMContentLoaded', function() {
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            
            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', function () {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    this.querySelector('i').classList.toggle('fa-eye');
                    this.querySelector('i').classList.toggle('fa-eye-slash');
                });
            }

            // Manejar botón de crear usuario móvil
            const mobileCreateUserButton = document.getElementById('mobileCreateUserButton');
            const sidebarCreateUserButton = document.getElementById('sidebarCreateUserButton');
            
            if (mobileCreateUserButton && sidebarCreateUserButton) {
                mobileCreateUserButton.addEventListener('click', function() {
                    sidebarCreateUserButton.click();
                });
            }
        });
    </script>
</body>
</html>
