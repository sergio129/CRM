<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Categorías de Ingresos - GESCOOP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css">
    <style>
        .nested-category {
            margin-left: 1.5rem;
            position: relative;
        }
        .nested-category::before {
            content: '└─';
            position: absolute;
            left: -1.5rem;
        }
        .badge-pill {
            border-radius: 10rem;
        }
        
        .stat-card {
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .filter-section {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .action-buttons .btn {
            margin-right: 5px;
        }
        
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1080 !important;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- El sidebar compartido se cargará aquí -->
        <div id="sidebar-container"></div>

        <!-- Page Content -->
        <div id="content">
            <nav class="navbar navbar-expand-lg navbar-light">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn btn-info">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h2 class="ml-3 mb-0">Gestión de Categorías de Ingresos</h2>
                </div>
            </nav>
            
            <!-- Toast container para notificaciones -->
            <div class="toast-container" id="toastContainer"></div>
            
            <!-- Main Content -->
            <div class="content-body">
                <!-- Botones de acción -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-12">
                                <div class="d-flex flex-wrap gap-2">
                                    <button class="btn btn-primary" id="nuevaCategoriaBtn">
                                        <i class="fas fa-plus me-1"></i> Nueva Categoría
                                    </button>
                                    <button class="btn btn-info" id="ordenarCategoriasBtn">
                                        <i class="fas fa-sort me-1"></i> Ordenar Categorías
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Tabla de Categorías -->
                <div class="card">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-tags me-2"></i>Listado de Categorías</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Nombre</th>
                                        <th>Descripción</th>
                                        <th>Requiere Cliente</th>
                                        <th>% Retención</th>
                                        <th>Permite Comisión</th>
                                        <th>Es Crédito</th>
                                        <th>Estado</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaCategorias">
                                    <!-- Aquí se cargarán las categorías -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Nueva/Editar Categoría -->
    <div class="modal fade" id="categoriaModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="categoriaModalTitle">Nueva Categoría de Ingreso</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="categoriaForm">
                        <input type="hidden" id="categoriaId">
                        <div class="mb-3">
                            <label for="categoriaNombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="categoriaNombre" required>
                        </div>
                        <div class="mb-3">
                            <label for="categoriaDescripcion" class="form-label">Descripción</label>
                            <textarea class="form-control" id="categoriaDescripcion" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="categoriaPadre" class="form-label">Categoría Padre</label>
                            <select class="form-select" id="categoriaPadre">
                                <option value="">Categoría Principal</option>
                                <!-- Aquí se cargarán las categorías para seleccionar como padre -->
                            </select>
                            <small class="form-text text-muted">Dejar vacío para crear una categoría principal</small>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="categoriaRetencion" class="form-label">% Retención</label>
                                <input type="number" class="form-control" id="categoriaRetencion" min="0" max="100" step="0.01" value="0">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="categoriaRequiereCliente">
                                    <label class="form-check-label" for="categoriaRequiereCliente">Requiere Cliente</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="categoriaPermiteComision">
                                    <label class="form-check-label" for="categoriaPermiteComision">Permite Comisión</label>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="categoriaEsCredito">
                                    <label class="form-check-label" for="categoriaEsCredito">Es Crédito</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="categoriaEsActivo" checked>
                                    <label class="form-check-label" for="categoriaEsActivo">Activo</label>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="guardarCategoriaBtn">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/locale/es.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.all.min.js"></script>
    
    <!-- Agregar el script del sidebar compartido -->
    <script src="js/sidebar-handler.js"></script>
    <script src="js/categorias-ingresos.js"></script>
    
    <script>
        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Mostrar/ocultar sidebar
            const sidebarCollapse = document.getElementById('sidebarCollapse');
            if (sidebarCollapse) {
                sidebarCollapse.addEventListener('click', function() {
                    const sidebar = document.getElementById('sidebar');
                    if (sidebar) {
                        sidebar.classList.toggle('active');
                    }
                });
            }
        });
    </script>
</body>
</html>
