<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Empleados - GESCOOP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="wrapper">
        <!-- El sidebar compartido se cargará aquí -->
        <div id="sidebar-container"></div>

        <!-- Page Content -->
        <div id="content">
            <nav class="navbar navbar-expand-lg navbar-light">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn btn-info">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h2 class="ml-3 mb-0">Gestión de Empleados</h2>
                </div>
            </nav>

            <div class="content-body">
                <div class="container mt-4">
                    <!-- Barra de búsqueda y botón nuevo empleado -->
                    <div class="row mb-3">
                        <div class="col-md-8">
                            <div class="input-group">
                                <input type="text" id="tableSearch" class="form-control search-input" placeholder="Buscar empleado...">
                                <button class="btn btn-outline-secondary search-btn" type="button" onclick="filterTable()">
                                    <i class="fas fa-search"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-4 text-end">
                            <button id="createEmployeeButton" class="btn btn-primary">
                                <i class="fas fa-plus me-1"></i> Nuevo Empleado
                            </button>
                        </div>
                    </div>

                    <!-- Tabla de Empleados -->
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Documento</th>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Teléfono</th>
                                <th>Cargo</th>
                                <th>Salario</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="employeeTableBody">
                            <!-- Los datos se cargarán dinámicamente desde la API -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para crear/editar empleado -->
    <div class="modal fade" id="employeeModal" tabindex="-1" aria-labelledby="employeeModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="employeeModalLabel">Empleado</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- Tabs para las secciones -->
                    <ul class="nav nav-tabs" id="employeeModalTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="personal-tab" data-bs-toggle="tab" data-bs-target="#personal" type="button" role="tab" aria-controls="personal" aria-selected="true">Información Personal</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="contact-tab" data-bs-toggle="tab" data-bs-target="#contact" type="button" role="tab" aria-controls="contact" aria-selected="false">Información de Contacto</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="work-tab" data-bs-toggle="tab" data-bs-target="#work" type="button" role="tab" aria-controls="work" aria-selected="false">Información Laboral</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="social-tab" data-bs-toggle="tab" data-bs-target="#social" type="button" role="tab" aria-controls="social" aria-selected="false">Seguridad Social y Banco</button>
                        </li>
                    </ul>

                    <!-- Contenido de las pestañas -->
                    <div class="tab-content" id="employeeModalTabsContent">
                        <div class="tab-pane fade show active" id="personal" role="tabpanel" aria-labelledby="personal-tab">
                            <!-- Información Personal -->
                            <div class="form-section">
                                <form id="employeeForm">
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="fullName" class="form-label required">Nombre Completo</label>
                                                <input type="text" class="form-control" id="fullName" required>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="idNumber" class="form-label required">Número de Documento</label>
                                                <input type="text" class="form-control" id="idNumber" required>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="fechaNacimiento" class="form-label">Fecha de Nacimiento</label>
                                                <input type="date" class="form-control" id="fechaNacimiento">
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="genero" class="form-label">Género</label>
                                                <select class="form-select" id="genero">
                                                    <option value="Masculino">Masculino</option>
                                                    <option value="Femenino">Femenino</option>
                                                    <option value="Otro">Otro</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="contact" role="tabpanel" aria-labelledby="contact-tab">
                            <!-- Información de Contacto -->
                            <div class="form-section">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="telefonoMovil" class="form-label required">Teléfono Móvil</label>
                                            <input type="tel" class="form-control" id="telefonoMovil" required>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="email" class="form-label required">Email</label>
                                            <input type="email" class="form-control" id="email" required>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-12">
                                        <div class="mb-3">
                                            <label for="direccion" class="form-label">Dirección</label>
                                            <input type="text" class="form-control" id="direccion">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="work" role="tabpanel" aria-labelledby="work-tab">
                            <!-- Información Laboral -->
                            <div class="form-section">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="cargo" class="form-label required">Cargo</label>
                                            <input type="text" class="form-control" id="cargo" required>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="salario" class="form-label required">Salario</label>
                                            <input type="number" class="form-control" id="salario" required>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="departamento" class="form-label">Departamento</label>
                                            <input type="text" class="form-control" id="departamento">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="role" class="form-label">Rol</label>
                                            <select class="form-select" id="role">
                                                <option value="">Sin rol asignado</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="fechaContratacion" class="form-label">Fecha de Contratación</label>
                                            <input type="date" class="form-control" id="fechaContratacion">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="tipoContrato" class="form-label">Tipo de Contrato</label>
                                            <select class="form-select" id="tipoContrato">
                                                <option value="">Seleccione tipo</option>
                                                <option value="Indefinido">Indefinido</option>
                                                <option value="Fijo">Término Fijo</option>
                                                <option value="Obra Labor">Obra o Labor</option>
                                                <option value="Prestación Servicios">Prestación de Servicios</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="horarioLaboral" class="form-label">Horario Laboral</label>
                                            <input type="text" class="form-control" id="horarioLaboral" placeholder="Ej. Lunes-Viernes 8am-5pm">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="riesgoARL" class="form-label">Nivel de Riesgo ARL</label>
                                            <select class="form-select" id="riesgoARL">
                                                <option value="1">Nivel I</option>
                                                <option value="2">Nivel II</option>
                                                <option value="3">Nivel III</option>
                                                <option value="4">Nivel IV</option>
                                                <option value="5">Nivel V</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-12">
                                        <div class="mb-3">
                                            <label for="estado" class="form-label">Estado</label>
                                            <select class="form-select" id="estado">
                                                <option value="Activo">Activo</option>
                                                <option value="Inactivo">Inactivo</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="social" role="tabpanel" aria-labelledby="social-tab">
                            <!-- Seguridad Social y Banco -->
                            <div class="form-section">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="eps" class="form-label">EPS</label>
                                            <input type="text" class="form-control" id="eps">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="afp" class="form-label">AFP</label>
                                            <input type="text" class="form-control" id="afp">
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="cajaCompensacion" class="form-label">Caja de Compensación</label>
                                            <input type="text" class="form-control" id="cajaCompensacion">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="banco" class="form-label">Banco</label>
                                            <input type="text" class="form-control" id="banco">
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="tipoCuenta" class="form-label">Tipo de Cuenta</label>
                                            <select class="form-select" id="tipoCuenta">
                                                <option value="Ahorros">Ahorros</option>
                                                <option value="Corriente">Corriente</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="numeroCuenta" class="form-label">Número de Cuenta</label>
                                            <input type="text" class="form-control" id="numeroCuenta">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="saveEmployee()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para ver detalles del empleado -->
    <div class="modal fade" id="employeeDetailModal" tabindex="-1" aria-labelledby="employeeDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="employeeDetailModalLabel">Detalles del Empleado</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="employee-details">
                        <div class="row mb-3">
                            <div class="col-md-4 fw-bold">Nombre Completo:</div>
                            <div class="col-md-8" id="employeeFullName"></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4 fw-bold">Email:</div>
                            <div class="col-md-8" id="employeeEmail"></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4 fw-bold">Teléfono:</div>
                            <div class="col-md-8" id="employeePhone"></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4 fw-bold">Cargo:</div>
                            <div class="col-md-8" id="employeePosition"></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4 fw-bold">Departamento:</div>
                            <div class="col-md-8" id="employeeDepartment"></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4 fw-bold">Fecha de Contratación:</div>
                            <div class="col-md-8" id="employeeHireDate"></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4 fw-bold">Estado:</div>
                            <div class="col-md-8">
                                <span class="estado-badge" id="employeeStatus"></span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container para notificaciones -->
    <div id="toastContainer" class="position-fixed top-0 end-0 p-3" style="z-index: 1055;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Agregar el script del sidebar compartido -->
    <script src="js/sidebar-handler.js"></script>
    <script src="js/empleados.js"></script>
</body>
</html>
